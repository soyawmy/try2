<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Nadin</title>
<style>
:root{
  --kraft:#e3b07c; --kraft-dark:#c98f5c; --ink:#4a2a3d; --paper:#f4ecd8; --accent:#8b5fa8; --gold:#e6b800;
  --pw:min(46vw, calc((100dvh - 190px) / 1.5));
  --cs:1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --kraft:#b98558; --kraft-dark:#9a6a42; --ink:#fff1dc; --paper:#efe5cf; } }
:root[data-theme="dark"]{ --kraft:#b98558; --kraft-dark:#9a6a42; --ink:#fff1dc; --paper:#efe5cf; }
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;min-height:100dvh;overflow:hidden;background-color:var(--kraft);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .27  0 0 0 0 .12  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  font-family:Georgia,'Times New Roman',serif;color:var(--ink);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--kraft);z-index:10}
.wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 12px 20px;gap:18px}
.book{position:relative;width:calc(var(--pw)*2);height:calc(var(--pw)*1.5);perspective:2600px;
  transform:scale(var(--cs)) translateX(calc(var(--pw) * -0.5));transition:transform 1s cubic-bezier(.6,.05,.25,1)}
.book.open{transform:scale(1) translateX(0)}
.page,.leaf{position:absolute;top:0;width:50%;height:100%}
.page.right{left:50%;border-radius:0 6px 6px 0;overflow:hidden;box-shadow:0 10px 30px rgba(60,30,10,.35)}
.page.right img.bg,.face img.bg{width:100%;height:100%;display:block;object-fit:fill;user-select:none;-webkit-user-drag:none}
.page.right::after,.face.back::after{content:"";position:absolute;top:0;bottom:0;width:14%;pointer-events:none}
.page.right::after{left:0;background:linear-gradient(90deg,rgba(40,20,5,.35),transparent)}
.face.back::after{right:0;background:linear-gradient(270deg,rgba(40,20,5,.35),transparent)}
.leaf{left:50%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.6,.05,.25,1);z-index:2}
.book.open .leaf{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.front{border-radius:0 6px 6px 0;box-shadow:0 10px 30px rgba(60,30,10,.4);cursor:pointer;padding:0;border:0;background:none;display:block}
.face.back{transform:rotateY(180deg);border-radius:6px 0 0 6px;box-shadow:0 10px 30px rgba(60,30,10,.35)}
.book:not(.open) .face.front:hover{filter:brightness(1.04)}
.book.open .face.front{pointer-events:none}
.hotspot{position:absolute;inset:0;border:0;padding:0;background:transparent;cursor:pointer;
  clip-path:polygon(7.5% 18.9%,25% 18.9%,33.3% 26.7%,50.8% 36.1%,51% 65.6%,37.5% 77.8%,25% 86.4%,7.5% 86.4%)}
.hotspot:hover{background:rgba(255,255,255,.12)}
.letter{position:absolute;left:28%;top:57%;width:38%;opacity:0;pointer-events:none;cursor:pointer;
  transform:translate(-50%,-50%) rotate(-4deg);transition:left .6s ease,top .6s ease,width .6s ease,opacity .45s ease,transform .6s ease;
  filter:drop-shadow(0 10px 18px rgba(40,20,5,.45));z-index:3;user-select:none;-webkit-user-drag:none}
.letter.lifted{left:50%;top:50%;width:86%;opacity:1;pointer-events:auto;transform:translate(-50%,-50%) rotate(-1deg)}
.flame{position:absolute;transform-origin:50% 94%;pointer-events:none;will-change:transform;
  filter:drop-shadow(0 0 7px rgba(255,190,90,.75));transition:opacity .25s ease;user-select:none}
.flame.out{opacity:0}
.smoke{position:absolute;width:5%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(250,240,230,.8),rgba(250,240,230,0) 70%);animation:smoke 1.8s ease-out forwards}
@keyframes smoke{from{transform:translate(-50%,0) scale(.4);opacity:.9}to{transform:translate(calc(-50% + 14px),-90px) scale(2.2);opacity:0}}
.wish{position:absolute;left:50%;top:3%;width:84%;transform:translate(-50%,-30px) rotate(-2deg);opacity:0;pointer-events:none;
  background:#f6ecd6;color:#5b2f78;text-align:center;padding:5% 4% 5%;z-index:4;transition:opacity .6s ease,transform .6s cubic-bezier(.3,1.4,.5,1);
  clip-path:polygon(0 3%,6% 0,14% 3%,24% 0,36% 3%,48% 0,60% 3%,72% 0,84% 3%,94% 0,100% 3%,100% 97%,92% 100%,80% 97%,68% 100%,54% 97%,42% 100%,30% 97%,18% 100%,8% 97%,0 100%);
  filter:drop-shadow(0 6px 10px rgba(40,20,5,.35))}
.wish.show{opacity:1;pointer-events:auto;transform:translate(-50%,0) rotate(-2deg)}
.wish h2{margin:0;font-size:clamp(15px,calc(var(--pw)*.085),38px);font-style:italic;line-height:1.15}
.wish p{margin:.4em 0 .6em;font-size:clamp(11px,calc(var(--pw)*.045),18px);color:#8a5a2b}
.btn{font:600 14px/1 Georgia,serif;border:2px solid #4a2a3d;background:#f9ee7a;color:#4a2a3d;padding:10px 16px;border-radius:4px;cursor:pointer;
  box-shadow:3px 3px 0 #4a2a3d;transition:transform .12s,box-shadow .12s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.btn:active,.btn.down{transform:translate(2px,2px);box-shadow:1px 1px 0 #4a2a3d}
.btn.purple{background:#9a6bb5;color:#fff9d6}
.wish .btn{font-size:clamp(10px,calc(var(--pw)*.045),14px);padding:.6em 1em}
.controls{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;min-height:46px;transition:opacity .5s;max-width:100%}
.controls.hidden{opacity:0;pointer-events:none;height:0;min-height:0;overflow:hidden}
.meter{display:flex;flex-direction:column;gap:4px;min-width:130px}
.meter .bar{position:relative;height:12px;border:2px solid #4a2a3d;border-radius:8px;background:#f6ecd6;overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0;width:0%;background:linear-gradient(90deg,#f6d34a,#e0667a,#8b5fa8)}
.meter .tick{position:absolute;top:0;bottom:0;width:2px;background:#4a2a3d;left:30%}
.meter small{font-size:11px;opacity:.9;text-align:center;color:var(--ink)}
.hint{font-style:italic;font-size:15px;transition:opacity .4s;color:var(--ink);text-align:center}
.hint.hidden{opacity:0;pointer-events:none;position:absolute}
.note{max-width:min(92vw,560px);text-align:center;font-size:12px;opacity:.95;color:var(--ink)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (prefers-reduced-motion: reduce){.book,.leaf{transition-duration:.01s}}
</style>
</head>

  <div class="hint" id="hint">Tap the cover to open ✉️</div>
  <div class="controls hidden" id="controls">
    <button class="btn" id="back" type="button">← Back to cover</button>
    <div class="meter"><div class="bar"><div class="fill" id="fill"></div><div class="tick" id="tick"></div></div><small id="micState">Mic off</small></div>
    <button class="btn purple" id="hold" type="button">Hold to blow 💨</button>
  </div>
  <div class="note" id="note"></div>
</div>
<canvas id="confetti"></canvas>

<script>
(function(){
'use strict';
var NAME='Nadin';                       // change the name in the wish message here
var $=function(id){return document.getElementById(id)};
var book=$('book'),cover=$('cover'),back=$('back'),letter=$('letter'),hotspot=$('hotspot'),
    controls=$('controls'),hint=$('hint'),fill=$('fill'),tick=$('tick'),micState=$('micState'),
    wish=$('wish'),holdBtn=$('hold'),note=$('note'),page=$('candlePage');
$('nm').textContent=NAME;
var flames=[].slice.call(document.querySelectorAll('.flame'));

/* ---------- sizing: bigger cover on small screens ---------- */
function fit(){
  var cs=document.documentElement.style, pw=parseFloat(getComputedStyle(book).width)/2||200;
  var s=Math.min((innerWidth*.78)/pw,(innerHeight-190)/(pw*1.5)/1,2.2); cs.setProperty('--cs',Math.max(1,s).toFixed(3));
}
addEventListener('resize',fit); fit();

/* ---------- open / close ---------- */
var isOpen=false;
function openBook(){
  if(isOpen) return; isOpen=true; book.classList.add('open');
  hint.classList.add('hidden'); controls.classList.remove('hidden');
  startMic();
}
function closeBook(){
  if(!isOpen) return; isOpen=false; book.classList.remove('open');
  controls.classList.add('hidden'); hint.classList.remove('hidden');
  letter.classList.remove('lifted'); stopMic(); relight(true);
}
cover.addEventListener('click',openBook); back.addEventListener('click',closeBook);

/* ---------- letter ---------- */
hotspot.addEventListener('click',function(){letter.classList.add('lifted')});
letter.addEventListener('click',function(){letter.classList.remove('lifted')});

/* ---------- mic ---------- */
var actx,analyser,stream,buf,micOn=false,baseline=0.01,micInt=0,level=0;
function setNote(t){note.textContent=t||''}
async function startMic(){
  if(micOn) return;
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    micState.textContent='Mic unavailable';
    setNote('Blowing needs a microphone and https. Host this file (don’t open it locally) — until then, hold the button or the space bar.');
    return;
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') await actx.resume();
    var src=actx.createMediaStreamSource(stream); analyser=actx.createAnalyser(); analyser.fftSize=1024; src.connect(analyser);
    buf=new Float32Array(analyser.fftSize); micOn=true; baseline=0.01;
    micState.textContent='Mic on — blow!'; setNote('');
  }catch(e){
    micState.textContent='Mic blocked';
    setNote('Mic blocked — no worries, hold the button or the space bar to blow.');
  }
}
function stopMic(){
  micOn=false; micInt=0; level=0;
  if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
  if(actx){actx.close();actx=null}
  micState.textContent='Mic off'; setNote('');
}
function readMic(){
  if(!micOn||!analyser){micInt=0;level=0;return}
  analyser.getFloatTimeDomainData(buf);
  var s=0;for(var i=0;i<buf.length;i++)s+=buf[i]*buf[i];
  var rms=Math.sqrt(s/buf.length);
  var thr=Math.max(0.035,baseline*3+0.015);
  if(rms<thr) baseline+= (rms-baseline)*0.03;
  level=Math.min(1,rms*5);
  tick.style.left=Math.min(95,thr*5*100)+'%';
  micInt=Math.max(0,Math.min(1,(rms-thr)/0.1));
}

/* ---------- hold-to-blow fallback ---------- */
var holding=false;
function hold(v){holding=v;holdBtn.classList.toggle('down',v)}
holdBtn.addEventListener('pointerdown',function(e){e.preventDefault();hold(true)});
['pointerup','pointerleave','pointercancel'].forEach(function(t){holdBtn.addEventListener(t,function(){hold(false)})});
addEventListener('keydown',function(e){if(e.code==='Space'&&isOpen){e.preventDefault();hold(true)}});
addEventListener('keyup',function(e){if(e.code==='Space'){hold(false)}});
holdBtn.addEventListener('contextmenu',function(e){e.preventDefault()});

/* ---------- flames ---------- */
var LIMIT=[0.46,0.54];           // seconds of blowing before each flame goes out
var blowT=[0,0],lit=[true,true],bend=0,smoothInt=0,tPrev=performance.now();
function puff(i){
  var f=flames[i],s=document.createElement('div');s.className='smoke';
  s.style.left=(parseFloat(f.style.left)+parseFloat(f.style.width)/2)+'%';
  s.style.top=(parseFloat(f.style.top)+parseFloat(f.dataset.hpct)*.7)+'%';
  page.appendChild(s);setTimeout(function(){s.remove()},1900);
}
function extinguish(i){
  lit[i]=false;flames[i].classList.add('out');puff(i);
  if(!lit[0]&&!lit[1]) setTimeout(celebrate,350);
}
function relight(silent){
  lit=[true,true];blowT=[0,0];wish.classList.remove('show');
  flames.forEach(function(f){f.classList.remove('out')});
}
$('relightTop').addEventListener('click',function(){relight()});
function frame(now){
  var dt=Math.min(.05,(now-tPrev)/1000);tPrev=now;
  if(isOpen){
    readMic();
    var target=Math.max(micInt,holding?.9:0);
    smoothInt+=(target-smoothInt)*Math.min(1,dt*(target>smoothInt?14:6));
    fill.style.width=Math.max(level*100,holding?60:0)+'%';
    bend+=(smoothInt*62-bend)*Math.min(1,dt*10);
    flames.forEach(function(f,i){
      if(!lit[i]) return;
      if(target>0.12){blowT[i]+=dt;if(blowT[i]>=LIMIT[i]) extinguish(i)} else blowT[i]=Math.max(0,blowT[i]-dt*1.5);
      var tt=now/1000,sway=Math.sin(tt*7+i*2)*2.2*(1-smoothInt)+Math.sin(tt*13+i)*1.2*(1-smoothInt);
      var sy=1+Math.sin(tt*9+i*1.7)*.04*(1-smoothInt)+smoothInt*.14,sx=1-smoothInt*.22;
      f.style.transform='rotate('+(bend+sway+(smoothInt>.1?Math.sin(tt*30+i)*3:0)).toFixed(2)+'deg) scale('+sx.toFixed(3)+','+sy.toFixed(3)+')';
    });
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- confetti ---------- */
var cv=$('confetti'),cx=cv.getContext('2d'),parts=[],running=false;
function sizeCv(){var d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',sizeCv);sizeCv();
function celebrate(){
  wish.classList.add('show');
  var r=page.getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height*.45,cols=['#9a6bb5','#f9ee7a','#e6b800','#d9506e','#f2a58e','#fff3d6','#6b8e3a'];
  for(var i=0;i<170;i++){var a=Math.random()*Math.PI*2,sp=4+Math.random()*10;
    parts.push({x:ox,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,w:6+Math.random()*7,h:4+Math.random()*6,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:1})}
  if(!running){running=true;requestAnimationFrame(stepC)}
}
function stepC(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(function(p){return p.life>0&&p.y<innerHeight+30});
  parts.forEach(function(p){p.vy+=.22;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.0045;
    cx.save();cx.globalAlpha=Math.max(0,Math.min(1,p.life*2));cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
  if(parts.length) requestAnimationFrame(stepC); else running=false;
}
})();
</script>
